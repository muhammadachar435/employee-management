services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: employee_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: employee_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - employee-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d employee_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build: ./backend
    container_name: employee_backend
    env_file:
      - ./backend/.env
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - employee-network

  # Frontend Next.js
  frontend:
    build: ./frontend
    container_name: employee_frontend
    env_file:
      - ./frontend/.env
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - employee-network

# Persistent PostgreSQL data
volumes:
  postgres_data:

# Internal Docker network
networks:
  employee-network:
    driver: bridge
